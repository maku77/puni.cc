  <ellipse cx="22" cy="30" rx="4.5" ry="5" fill="#1e0f3a"/>
  <ellipse cx="42" cy="30" rx="4.5" ry="5" fill="#1e0f3a"/>
  <!-- 目のハイライト -->
  <circle cx="24" cy="28" r="1.8" fill="white"/>
  <circle cx="44" cy="28" r="1.8" fill="white"/>
  <!-- ほっぺ -->
  <ellipse cx="17" cy="37" rx="5" ry="3" fill="#ff88bb" opacity="0.55"/>
  <ellipse cx="47" cy="37" rx="5" ry="3" fill="#ff88bb" opacity="0.55"/>
  <!-- 笑顔 -->
  <path d="M 22 39 Q 32 47 42 39" stroke="#1e0f3a" stroke-width="2.8" fill="none" stroke-linecap="round"/>
