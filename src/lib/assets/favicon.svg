<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="body" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#d4a8ff"/>
      <stop offset="100%" stop-color="#7733cc"/>
    </radialGradient>
  </defs>
  <!-- プニプニなボディ（少し縦長の楕円でもちもち感） -->
  <ellipse cx="32" cy="33" rx="27" ry="28" fill="url(#body)"/>
  <!-- ハイライト（つやつや感） -->
  <ellipse cx="23" cy="20" rx="9" ry="5.5" fill="white" opacity="0.22" transform="rotate(-20 23 20)"/>
